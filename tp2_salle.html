      <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
    </a-entity>

    <!-- Table B : plateau avec 3 zones de dépôt -->
    <a-entity id="Table_B" position="0.6 0 -1">
      <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6" material="color: #eceff1; roughness: 0.5"></a-box>
      <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>

      <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
    </a-entity>

    <a-plane position="0 2.0 -2.95" width="2.4" height="0.9" material="color: #1b2a41; shader: flat"></a-plane>

<a-scene id="scene" vr-mode-ui="enabled: false" renderer="antialias: true">

  <!-- ============ BLOC 1 : ENVIRONNEMENT (organisé par fonction) ============ -->

    <a-sky color="#9ec9ee"></a-sky>
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>

    <a-plane id="Sol" class="interactif" teleport-sol rotation="-90 0 0" width="6" height="6"

    <!-- Murs (hauteur 3 m) -->
    <a-plane position="0 1.5 -3" width="6" height="3" material="color: #e8eef5"></a-plane>
    <a-plane position="-3 1.5 0" rotation="0 90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
    <a-plane position="3 1.5 0" rotation="0 -90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
    <a-plane position="0 1.5 3" rotation="0 180 0" width="6" height="3" material="color: #e8eef5"></a-plane>

    <!-- Table A : instruments (plateau à 0,75 m du sol, comme une vraie table) -->
    <a-entity id="Table_A" position="-0.6 0 -1">
      <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6" material="color: #8d6e63; roughness: 0.8"></a-box>
      <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
      <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
    </a-entity>

    <!-- Table B : plateau avec 3 zones de dépôt -->
    <a-entity id="Table_B" position="0.6 0 -1">
      <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6" material="color: #eceff1; roughness: 0.5"></a-box>
      <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
      <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
    </a-entity>

    <!-- Panneau de mission ancré dans le monde (pas collé à la tête) -->
    <a-plane position="0 2.0 -2.95" width="2.4" height="0.9" material="color: #1b2a41; shader: flat"></a-plane>

    <a-text position="0 2.55 -2.93" width="2.2" align="center" color="#ffd54f"

  <!-- ============ BLOC 2 : INSTRUMENTS (posés sur la Table A, coordonnées monde) ============ -->
  <!-- Chaque instrument connaît sa zone cible (attribut zone). -->
  <a-entity id="Instruments">
    <a-cylinder id="Seringue" class="interactif" instrument="nom: Seringue; zone: zone-seringue"

           material="color: #e53935"></a-box>
  </a-entity>

  <!-- ============ BLOC 3 : ZONES DE DEPOT (sur la Table B) ============ -->
  <!-- Ordre volontairement différent de la Table A : il faut lire les étiquettes. -->
  <a-entity id="Zones">
    <a-box id="zone-thermometre" class="interactif" zone-depot="nom: Thermomètre"
           position="0.3 0.755 -1" width="0.26" height="0.01" depth="0.3"
           material="color: #fff59d; opacity: 0.8"></a-box>
    <a-text position="0.3 0.8 -1.2" width="0.8" align="center" color="#263238" value="Thermomètre"></a-text>

    <a-box id="zone-seringue" class="interactif" zone-depot="nom: Seringue"
           position="0.6 0.755 -1" width="0.26" height="0.01" depth="0.3"
           material="color: #fff59d; opacity: 0.8"></a-box>
    <a-text position="0.6 0.8 -1.2" width="0.8" align="center" color="#263238" value="Seringue"></a-text>

           material="color: #fff59d; opacity: 0.8"></a-box>

  <!-- On déplace le RIG, jamais la caméra seule. wasd : test sur ordinateur. -->

    <!-- Hauteur des yeux : 1,6 m (personne debout) -->
    <a-entity id="tete" camera position="0 1.6 0" look-controls>
      <a-entity id="curseur" cursor="fuse: false" raycaster="objects: .interactif; far: 8"

                geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
                material="color: #ffffff; shader: flat; opacity: 0.9"></a-entity>
    </a-entity>

<script>
/* ===================== ETAT GLOBAL DE LA MISSION ===================== */
const etat = {
  selection: null,   // instrument actuellement tenu
  places: 0,         // instruments bien placés
  total: 3,
  erreurs: 0
};

const hud = document.getElementById('hud');
function message(txt) { hud.textContent = txt; }

function majPanneau() {
  const panneau = document.getElementById('Panneau');
  if (etat.places === etat.total) {
    panneau.setAttribute('value',
      'Mission terminée !\n' + etat.total + '/' + etat.total + ' instruments placés\nErreurs : ' + etat.erreurs);
  } else {
    panneau.setAttribute('value',
      'Salle de formation\nPlacés : ' + etat.places + '/' + etat.total + '\nErreurs : ' + etat.erreurs);
  }
}

// Le raycaster doit "oublier" un objet qui n'a plus la classe .interactif
function rafraichirRaycaster() {
  const c = document.getElementById('curseur');
  if (c && c.components.raycaster) c.components.raycaster.refreshObjects();
}

/* ===================== 1. TELEPORTATION SUR LE SOL ===================== */
AFRAME.registerComponent('teleport-sol', {
  init: function () {
    const rig = document.getElementById('rig');
    const limite = 2.7; // on reste à 30 cm des murs (salle de 6 m)
    const borner = v => Math.max(-limite, Math.min(limite, v));

    this.el.addEventListener('click', function (e) {
      const inter = e.detail && e.detail.intersection;
      if (!inter) return;
      const p = inter.point; // point touché, en coordonnées monde
      // On déplace le RIG (jamais la caméra), et on garde y = 0 (au sol)
      rig.object3D.position.set(borner(p.x), 0, borner(p.z));
    });
  }
});

/* ===================== 2. INSTRUMENT : prendre / relâcher ===================== */
AFRAME.registerComponent('instrument', {
  schema: {
    nom:  { type: 'string' },
    zone: { type: 'string' }   // id de la zone correcte
  },
  init: function () {
    this.origine = this.el.object3D.position.clone();
    this.place = false;
    this.el.addEventListener('click', () => this.prendre());
  },
  prendre: function () {
    if (this.place) return;
    // Un seul instrument tenu à la fois
    if (etat.selection && etat.selection !== this.el) {
      etat.selection.components.instrument.relacher();
    }
    etat.selection = this.el;
    // Retour visuel : l'objet se soulève et grossit
    this.el.object3D.position.y = this.origine.y + 0.08;
    this.el.object3D.scale.set(1.3, 1.3, 1.3);
    message('Vous tenez : ' + this.data.nom + '. Visez sa zone sur la table B et touchez.');
  },
  relacher: function () {
    this.el.object3D.position.copy(this.origine);
    this.el.object3D.scale.set(1, 1, 1);
    if (etat.selection === this.el) etat.selection = null;
  },
  deposer: function (zoneEl) {
    const p = zoneEl.object3D.position;
    // Même hauteur de plateau sur les deux tables : on garde le y d'origine
    this.el.object3D.position.set(p.x, this.origine.y, p.z);
    this.el.object3D.scale.set(1, 1, 1);
    this.place = true;
    this.el.classList.remove('interactif'); // on ne peut plus le reprendre
    etat.selection = null;
    rafraichirRaycaster();
  }
});

/* ===================== 3. ZONE DE DEPOT : vérifier ===================== */
AFRAME.registerComponent('zone-depot', {
  schema: { nom: { type: 'string' } },
  init: function () {
    this.occupee = false;
    this.el.addEventListener('click', () => this.recevoir());
  },
  recevoir: function () {
    const inst = etat.selection;
    if (!inst) {
      message('Prenez d\'abord un instrument sur la table A.');
      return;
    }
    if (this.occupee) {
      message('Cette zone est déjà occupée.');
      return;
    }
    const comp = inst.components.instrument;

    if (comp.data.zone === this.el.id) {
      // ---- Bonne zone ----
      comp.deposer(this.el);
      this.occupee = true;
      this.el.setAttribute('material', 'color', '#66bb6a');
      this.el.classList.remove('interactif');
      rafraichirRaycaster();
      etat.places++;
      majPanneau();
      if (etat.places === etat.total) {
        message('Bravo ! Tous les instruments sont à leur place (erreurs : ' + etat.erreurs + ').');
      } else {
        message('Correct : ' + comp.data.nom + ' est bien placé. Instrument suivant !');
      }
    } else {
      // ---- Mauvaise zone : flash rouge puis retour à la couleur normale ----
      etat.erreurs++;
      majPanneau();
      const el = this.el;
      el.setAttribute('material', 'color', '#ef5350');
      setTimeout(() => { if (!this.occupee) el.setAttribute('material', 'color', '#fff59d'); }, 600);
      message('Non : ici c\'est la zone « ' + this.data.nom + ' ». Essayez une autre zone.');
    }
  }
});

/* Affichage initial du panneau */
document.getElementById('scene').addEventListener('loaded', majPanneau);
</script>

  <!-- Ordre volontairement différent de la Table A : il faut lire les étiquettes. -->
  <a-entity id="Zones">
    <a-box id="zone-thermometre" class="interactif" zone-depot="nom: Thermomètre"
           position="0.3 0.755 -1" width="0.26" height="0.01" depth="0.3"
           material="color: #fff59d; opacity: 0.8"></a-box>
    <a-text position="0.3 0.8 -1.2" width="0.8" align="center" color="#263238" value="Thermomètre"></a-text>

    <a-box id="zone-seringue" class="interactif" zone-depot="nom: Seringue"
           position="0.6 0.755 -1" width="0.26" height="0.01" depth="0.3"
           material="color: #fff59d; opacity: 0.8"></a-box>
    <a-text position="0.6 0.8 -1.2" width="0.8" align="center" color="#263238" value="Seringue"></a-text>

    <a-box id="zone-stethoscope" class="interactif" zone-depot="nom: Stéthoscope"
           position="0.9 0.755 -1" width="0.26" height="0.01" depth="0.3"
           material="color: #fff59d; opacity: 0.8"></a-box>
    <a-text position="0.9 0.8 -1.2" width="0.8" align="center" color="#263238" value="Stéthoscope"></a-text>
  </a-entity>

  <!-- ============ BLOC 4 : XR ORIGIN (rig) + caméra + curseur ============ -->
  <!-- On déplace le RIG, jamais la caméra seule. wasd : test sur ordinateur. -->
  <a-entity id="rig" position="0 0 0.8" wasd-controls="acceleration: 15">
    <!-- Hauteur des yeux : 1,6 m (personne debout) -->
    <a-entity id="tete" camera position="0 1.6 0" look-controls>
      <a-entity id="curseur" cursor="fuse: false" raycaster="objects: .interactif; far: 8"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
                material="color: #ffffff; shader: flat; opacity: 0.9"></a-entity>
    </a-entity>
  </a-entity>

</a-scene>

<script>
/* ===================== ETAT GLOBAL DE LA MISSION ===================== */
const etat = {
  selection: null,   // instrument actuellement tenu
  places: 0,         // instruments bien placés
  total: 3,
  erreurs: 0,
  debut: null,       // heure de la 1re prise (ms) -> démarre le chrono
  fin: null,         // heure de fin de mission (ms)
  journal: []        // ETAPE E : télémétrie (un objet par événement)
};

const hud = document.getElementById('hud');
function message(txt) { hud.textContent = txt; }

/* ---------- ETAPE E : chronomètre ---------- */
function secondesEcoulees() {
  if (!etat.debut) return 0;
  const fin = etat.fin || performance.now();
  return (fin - etat.debut) / 1000;
}

function majPanneau() {
  const panneau = document.getElementById('Panneau');
  const t = secondesEcoulees().toFixed(1) + ' s';
  if (etat.places === etat.total) {
    panneau.setAttribute('value',
      'Mission terminée !\nTemps : ' + t + '\nErreurs : ' + etat.erreurs);
  } else {
    panneau.setAttribute('value',
      'Placés : ' + etat.places + '/' + etat.total + '\nErreurs : ' + etat.erreurs + '\nTemps : ' + t);
  }
}

// Le chrono avance tant que la mission est en cours (mise à jour 4 fois/s)
setInterval(() => { if (etat.debut && !etat.fin) majPanneau(); }, 250);

/* ---------- ETAPE E : retour sonore (Web Audio, aucun fichier externe) ---------- */
let audioCtx = null;
function bip(freq, duree) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duree);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duree);
  } catch (e) { /* son indisponible : on continue sans */ }
}
const sonPrise   = () => bip(660, 0.08);
const sonBon     = () => { bip(880, 0.12); setTimeout(() => bip(1175, 0.15), 120); };
const sonFaux    = () => bip(180, 0.3);
const sonVictoire = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => bip(f, 0.18), i * 150));

/* ---------- ETAPE E : journal d'événements (télémétrie) ---------- */
function journaliser(type, details) {
  etat.journal.push(Object.assign({
    t: Number(secondesEcoulees().toFixed(2)), // secondes depuis la 1re prise
    type: type
  }, details || {}));
}

// Le raycaster doit "oublier" un objet qui n'a plus la classe .interactif
function rafraichirRaycaster() {
  const c = document.getElementById('curseur');
  if (c && c.components.raycaster) c.components.raycaster.refreshObjects();
}

/* ===================== 1. TELEPORTATION SUR LE SOL ===================== */
AFRAME.registerComponent('teleport-sol', {
  init: function () {
    const rig = document.getElementById('rig');
    const limite = 2.7; // on reste à 30 cm des murs (salle de 6 m)
    const borner = v => Math.max(-limite, Math.min(limite, v));

    this.el.addEventListener('click', function (e) {
      const inter = e.detail && e.detail.intersection;
      if (!inter) return;
      const p = inter.point; // point touché, en coordonnées monde
      // On déplace le RIG (jamais la caméra), et on garde y = 0 (au sol)
      rig.object3D.position.set(borner(p.x), 0, borner(p.z));
      journaliser('teleportation', { x: Number(borner(p.x).toFixed(2)), z: Number(borner(p.z).toFixed(2)) });
    });
  }
});

/* ===================== 2. INSTRUMENT : prendre / relâcher ===================== */
AFRAME.registerComponent('instrument', {
  schema: {
    nom:  { type: 'string' },
    zone: { type: 'string' }   // id de la zone correcte
  },
  init: function () {
    this.origine = this.el.object3D.position.clone();
    this.place = false;
    this.el.addEventListener('click', () => this.prendre());
  },
  prendre: function () {
    if (this.place) return;
    // Un seul instrument tenu à la fois
    if (etat.selection && etat.selection !== this.el) {
      etat.selection.components.instrument.relacher();
    }
    etat.selection = this.el;
    if (!etat.debut) etat.debut = performance.now(); // démarrage du chrono
    // Retour visuel : l'objet se soulève et grossit
    this.el.object3D.position.y = this.origine.y + 0.08;
    this.el.object3D.scale.set(1.3, 1.3, 1.3);
    sonPrise();
    journaliser('prise', { instrument: this.data.nom });
    message('Vous tenez : ' + this.data.nom + '. Visez sa zone sur la table B et touchez.');
  },
  relacher: function () {
    this.el.object3D.position.copy(this.origine);
    this.el.object3D.scale.set(1, 1, 1);
    if (etat.selection === this.el) etat.selection = null;
  },
  reinitialiser: function () {
    this.relacher();
    this.place = false;
    this.el.classList.add('interactif');
  },
  deposer: function (zoneEl) {
    const p = zoneEl.object3D.position;
    // Même hauteur de plateau sur les deux tables : on garde le y d'origine
    this.el.object3D.position.set(p.x, this.origine.y, p.z);
    this.el.object3D.scale.set(1, 1, 1);
    this.place = true;
    this.el.classList.remove('interactif'); // on ne peut plus le reprendre
    etat.selection = null;
    rafraichirRaycaster();
  }
});

/* ===================== 3. ZONE DE DEPOT : vérifier ===================== */
AFRAME.registerComponent('zone-depot', {
  schema: { nom: { type: 'string' } },
  init: function () {
    this.occupee = false;
    this.el.addEventListener('click', () => this.recevoir());
  },
  recevoir: function () {
    const inst = etat.selection;
    if (!inst) {
      message('Prenez d\'abord un instrument sur la table A.');
      return;
    }
    if (this.occupee) {
      message('Cette zone est déjà occupée.');
      return;
    }
    const comp = inst.components.instrument;

    if (comp.data.zone === this.el.id) {
      // ---- Bonne zone ----
      comp.deposer(this.el);
      this.occupee = true;
      this.el.setAttribute('material', 'color', '#66bb6a');
      this.el.classList.remove('interactif');
      rafraichirRaycaster();
      etat.places++;
      journaliser('depot', { instrument: comp.data.nom, zone: this.data.nom, correct: true });
      if (etat.places === etat.total) {
        etat.fin = performance.now();
        journaliser('fin', { erreurs: etat.erreurs, temps_s: Number(secondesEcoulees().toFixed(2)) });
        sonVictoire();
        message('Bravo ! Mission terminée en ' + secondesEcoulees().toFixed(1) + ' s (erreurs : ' + etat.erreurs + ').');
        console.table(etat.journal);
      } else {
        sonBon();
        message('Correct : ' + comp.data.nom + ' est bien placé. Instrument suivant !');
      }
      majPanneau();
    } else {
      // ---- Mauvaise zone : flash rouge puis retour à la couleur normale ----
      etat.erreurs++;
      sonFaux();
      journaliser('depot', { instrument: comp.data.nom, zone: this.data.nom, correct: false });
      majPanneau();
      const el = this.el;
      el.setAttribute('material', 'color', '#ef5350');
      setTimeout(() => { if (!this.occupee) el.setAttribute('material', 'color', '#fff59d'); }, 600);
      message('Non : ici c\'est la zone « ' + this.data.nom + ' ». Essayez une autre zone.');
    }
  }
});

/* ===================== 4. ETAPE E : RECOMMENCER ===================== */
AFRAME.registerComponent('bouton-recommencer', {
  init: function () {
    this.el.addEventListener('click', function () {
      // Instruments -> retour sur la table A
      document.querySelectorAll('[instrument]').forEach(el => el.components.instrument.reinitialiser());
      // Zones -> libres et jaunes
      document.querySelectorAll('[zone-depot]').forEach(el => {
        el.components['zone-depot'].occupee = false;
        el.setAttribute('material', 'color', '#fff59d');
        el.classList.add('interactif');
      });
      // Joueur -> position de départ
      document.getElementById('rig').object3D.position.set(0, 0, 0.8);
      // Etat -> remis à zéro (on garde un nouveau journal vide)
      Object.assign(etat, { selection: null, places: 0, erreurs: 0, debut: null, fin: null, journal: [] });
      rafraichirRaycaster();
      majPanneau();
      bip(440, 0.1);
      message('Nouvelle tentative : prenez un instrument sur la table A.');
    });
  }
});

/* ===================== 5. ETAPE E : EXPORTER LE JOURNAL (JSON) ===================== */
AFRAME.registerComponent('bouton-exporter', {
  init: function () {
    this.el.addEventListener('click', function () {
      if (etat.journal.length === 0) {
        message('Journal vide : faites d\'abord la mission.');
        return;
      }
      const donnees = {
        tp: 'TP2', etape: 'E',
        date: new Date().toISOString(),
        termine: etat.places === etat.total,
        temps_s: Number(secondesEcoulees().toFixed(2)),
        erreurs: etat.erreurs,
        evenements: etat.journal
      };
      const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'journal_tp2_' + Date.now() + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      message('Journal exporté (' + etat.journal.length + ' événements).');
    });
  }
});

/* Affichage initial du panneau */
document.getElementById('scene').addEventListener('loaded', majPanneau);
</script>
</body>
</html>
</script>
</body>
</html>
